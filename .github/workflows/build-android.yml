name: Build GENZ Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project directory
        id: locate
        run: |
          if [ -f "package.json" ]; then
            PROJECT_DIR="."
          else
            FOUND_PKG=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" -not -path "*/android/*" | head -n 1 || true)
            if [ -n "$FOUND_PKG" ]; then
              PROJECT_DIR=$(dirname "$FOUND_PKG")
            else
              echo "::error::package.json was not found in the repository! Please make sure you uploaded/committed package.json (and all project files) to GitHub."
              ls -la
              exit 1
            fi
          fi
          echo "Detected project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Type check
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: npm run lint

      - name: Build web assets
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Prepare Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            chmod +x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GENZ-Android-APK
          path: ${{ steps.locate.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
